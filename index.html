<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0c0b">
  <title>Vertical Habits</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{
      --bg-deep:#0a0c0b;--bg-card:#121614;--bg-elevated:#1a1f1c;
      --earth-forest:#3d6b4f;--earth-sage:#5a8a62;--earth-moss:#4a7856;
      --accent-green:#4faa5a;--accent-teal:#3a9b8c;--accent-lime:#7ab356;
      --recovery-color:#5a9b6a;--training-color:#4a8fd4;--performance-color:#d4a84a;
      --text-primary:#e8f0ea;--text-secondary:rgba(232,240,234,0.65);--text-muted:rgba(232,240,234,0.4);
      --glass-border:rgba(232,240,234,0.08);--glass-border-light:rgba(232,240,234,0.15);
      --font-display:'Space Grotesk',sans-serif;--font-body:'Inter',sans-serif;
      --radius-sm:10px;--radius-md:14px;--radius-lg:20px;--radius-xl:28px;
    }
    .light-mode{
      --bg-deep:#f5f7f6;--bg-card:#ffffff;--bg-elevated:#eef2f0;
      --text-primary:#1a1f1c;--text-secondary:rgba(26,31,28,0.65);--text-muted:rgba(26,31,28,0.4);
      --glass-border:rgba(26,31,28,0.1);--glass-border-light:rgba(26,31,28,0.18);
    }
    body{font-family:var(--font-body);background:var(--bg-deep);color:var(--text-primary);min-height:100vh;overflow-x:hidden;transition:background 0.3s,color 0.3s}
    .mountain-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0.4;transition:opacity 0.3s}
    .light-mode .mountain-bg{opacity:0.25}
    .mountain-layer{position:absolute;bottom:0;left:0;width:100%;transition:height 2s cubic-bezier(0.4,0,0.2,1)}
    .mountain-1{background:linear-gradient(to top,rgba(74,120,86,0.35)0%,transparent 100%);clip-path:polygon(0% 100%,20% 40%,40% 60%,60% 30%,80% 50%,100% 20%,100% 100%)}
    .mountain-2{background:linear-gradient(to top,rgba(90,138,98,0.25)0%,transparent 100%);clip-path:polygon(0% 100%,15% 50%,35% 70%,55% 45%,75% 65%,95% 35%,100% 100%)}
    .mountain-3{background:linear-gradient(to top,rgba(61,107,79,0.15)0%,transparent 100%);clip-path:polygon(0% 100%,10% 60%,30% 80%,50% 55%,70% 75%,90% 50%,100% 100%)}
    .app{position:relative;z-index:1;max-width:500px;margin:0 auto;min-height:100vh;background:linear-gradient(180deg,rgba(10,12,11,0.97)0%,rgba(10,12,11,0.95)100%);transition:background 0.3s}
    .light-mode .app{background:linear-gradient(180deg,rgba(245,247,246,0.97)0%,rgba(245,247,246,0.95)100%)}
    .header{padding:20px 20px 18px;background:linear-gradient(180deg,var(--bg-elevated)0%,transparent 100%);border-bottom:1px solid var(--glass-border)}
    .logo{font-family:var(--font-display);font-size:32px;font-weight:800;text-align:center;background:linear-gradient(135deg,var(--earth-sage)0%,var(--accent-green)50%,var(--accent-lime)100%);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px;margin-bottom:8px}
    .day-info{text-align:center;font-size:13px;color:var(--text-secondary);margin-bottom:10px;font-weight:500}
    .day-badge{display:inline-block;padding:10px 24px;border-radius:var(--radius-lg);font-size:14px;font-weight:800;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all 0.3s;border:2px solid}
    .badge-r{background:rgba(90,155,106,0.15);border-color:var(--recovery-color);color:var(--recovery-color);box-shadow:0 0 16px rgba(90,155,106,0.25)}
    .badge-t{background:rgba(74,143,212,0.15);border-color:var(--training-color);color:var(--training-color);box-shadow:0 0 16px rgba(74,143,212,0.25)}
    .badge-p{background:rgba(212,168,74,0.15);border-color:var(--performance-color);color:var(--performance-color);box-shadow:0 0 16px rgba(212,168,74,0.25)}
    .content{padding:16px 16px calc(95px + env(safe-area-inset-bottom)) 16px}
    .page{display:none}.page.active{display:block;animation:fadeIn 0.4s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .week-nav{display:flex;justify-content:center;padding:10px;background:var(--bg-card);border:1px solid var(--glass-border);border-radius:var(--radius-md);margin-bottom:14px}
    .days-container{display:flex;gap:4px}
    .day-col{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 5px;border-radius:var(--radius-sm);min-width:38px;cursor:pointer;transition:all 0.3s}
    .day-col:hover{background:rgba(232,240,234,0.04)}
    .day-col.today{background:rgba(90,138,98,0.12)}
    .day-col.selected{background:var(--bg-elevated);border:1px solid var(--glass-border-light)}
    .day-letter{font-size:12px;font-weight:700;color:var(--text-primary)}
    .day-type{font-size:9px;font-weight:800;padding:3px 5px;border-radius:5px;letter-spacing:1px}
    .day-type.r{background:rgba(90,155,106,0.2);color:var(--recovery-color)}
    .day-type.t{background:rgba(74,143,212,0.2);color:var(--training-color)}
    .day-type.p{background:rgba(212,168,74,0.2);color:var(--performance-color)}
    .view-toggle{display:flex;gap:5px;margin-bottom:14px;background:var(--bg-card);border:1px solid var(--glass-border);border-radius:var(--radius-md);padding:4px}
    .view-btn{flex:1;padding:10px;background:transparent;border:none;color:var(--text-muted);font-size:13px;font-weight:600;border-radius:var(--radius-sm);cursor:pointer;transition:all 0.3s}
    .view-btn.active{background:var(--bg-elevated);color:var(--text-primary)}
    .habits-list{display:grid;gap:10px}
    .habit{background:var(--bg-card);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:16px;transition:all 0.3s}
    .habit.completed{background:linear-gradient(135deg,rgba(79,170,90,0.12),rgba(79,170,90,0.04));border-color:rgba(79,170,90,0.25)}
    .habit-top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
    .checkbox{width:24px;height:24px;border:2px solid var(--glass-border-light);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--bg-elevated);transition:all 0.3s;flex-shrink:0}
    .checkbox.checked{background:linear-gradient(135deg,var(--accent-green),var(--earth-forest));border-color:var(--accent-green)}
    .checkbox svg{width:12px;height:12px;opacity:0;transition:all 0.2s;stroke:white;stroke-width:3;fill:none}
    .checkbox.checked svg{opacity:1}
    .habit-title{flex:1;font-weight:600;font-size:14px;color:var(--text-primary)}
    .info-btn{width:30px;height:30px;border-radius:50%;background:var(--bg-elevated);border:1px solid var(--glass-border);color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.3s;flex-shrink:0;font-family:Georgia,serif;font-size:14px;font-style:italic}
    .habit-desc{font-size:12px;color:var(--text-secondary);line-height:1.4;padding-left:36px}
    .fab{position:fixed;bottom:95px;right:16px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--earth-forest),var(--accent-green));border:none;color:white;cursor:pointer;box-shadow:0 6px 20px rgba(74,120,86,0.4);display:flex;align-items:center;justify-content:center;transition:all 0.3s;z-index:50}
    .fab svg{width:22px;height:22px;stroke:white;stroke-width:2.5}
    .card{background:var(--bg-card);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:18px;margin-bottom:14px}
    .card-title{font-family:var(--font-display);font-size:16px;font-weight:700;margin-bottom:14px;color:var(--text-primary)}
    .stat-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--glass-border)}
    .stat-row:last-child{border-bottom:none;padding-bottom:0}
    .stat-row:first-of-type{padding-top:0}
    .stat-label{font-size:13px;color:var(--text-secondary);font-weight:500}
    .stat-value{font-size:16px;font-weight:700;color:var(--accent-green)}
    .input-group{margin-bottom:14px}
    .input-label{display:block;font-size:11px;font-weight:600;margin-bottom:6px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px}
    .input{width:100%;padding:12px 14px;background:var(--bg-elevated);border:1px solid var(--glass-border);border-radius:var(--radius-md);color:var(--text-primary);font-family:var(--font-body);font-size:14px;transition:all 0.3s}
    .input:focus{outline:none;border-color:var(--earth-forest);box-shadow:0 0 0 3px rgba(61,107,79,0.2)}
    select.input{cursor:pointer}select.input option{background:var(--bg-card);color:var(--text-primary)}
    textarea.input{min-height:80px;resize:vertical}
    .btn{padding:12px 20px;border-radius:var(--radius-md);border:none;font-family:var(--font-body);font-size:13px;font-weight:600;cursor:pointer;transition:all 0.3s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
    .btn-primary{background:linear-gradient(135deg,var(--earth-forest),var(--accent-green));color:white;box-shadow:0 4px 14px rgba(61,107,79,0.35)}
    .btn-secondary{background:var(--bg-elevated);border:1px solid var(--glass-border);color:var(--text-primary)}
    .btn-danger{background:rgba(160,80,80,0.15);border:1px solid rgba(160,80,80,0.3);color:#c89090}
    .btn-skip{background:transparent;border:1px solid var(--glass-border);color:var(--text-muted);padding:10px 18px}
    .timer-display{text-align:center;padding:16px 16px 8px}
    .timer-time{font-family:var(--font-display);font-size:56px;font-weight:700;margin-bottom:14px;letter-spacing:2px;background:linear-gradient(135deg,var(--text-primary),var(--accent-green));-webkit-background-clip:text;background-clip:text;color:transparent}
    .timer-controls{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
    .timer-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
    .interval-timer{margin-top:16px;padding-top:16px;border-top:1px solid var(--glass-border)}
    .session{background:var(--bg-card);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:16px;margin-bottom:10px}
    .session-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .session-date{font-weight:600;font-size:14px}
    .session-grade{padding:4px 10px;border-radius:var(--radius-sm);font-size:11px;font-weight:700;background:rgba(61,107,79,0.2);border:1px solid var(--earth-forest);color:var(--accent-green)}
    .session-details{font-size:12px;color:var(--text-secondary);line-height:1.5}
    .settings-section{margin-bottom:24px}
    .settings-title{font-family:var(--font-display);font-size:18px;font-weight:700;margin-bottom:14px;color:var(--text-primary)}
    .setting-item{background:var(--bg-card);border:1px solid var(--glass-border);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
    .setting-label{font-size:13px;font-weight:500}
    .toggle{width:46px;height:26px;background:var(--bg-elevated);border-radius:13px;position:relative;cursor:pointer;transition:background 0.3s;border:1px solid var(--glass-border)}
    .toggle.on{background:linear-gradient(135deg,var(--accent-green),var(--earth-forest));border-color:var(--accent-green)}
    .toggle-thumb{width:20px;height:20px;background:white;border-radius:50%;position:absolute;top:2px;left:2px;transition:transform 0.3s}
    .toggle.on .toggle-thumb{transform:translateX(20px)}
    .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));max-width:500px;width:calc(100% - 28px);display:flex;gap:5px;z-index:2147483647;padding:6px;background:var(--bg-card);border:1px solid var(--glass-border);border-radius:var(--radius-xl);box-shadow:0 6px 28px rgba(0,0,0,0.5)}
    .light-mode .nav{box-shadow:0 6px 28px rgba(0,0,0,0.15)}
    #bottomNav{display:none}
    .nav-item{flex:1;display:flex;align-items:center;justify-content:center;padding:14px 10px;border-radius:var(--radius-lg);background:transparent;border:none;color:var(--text-muted);cursor:pointer;transition:all 0.3s;font-family:var(--font-body);font-size:13px;font-weight:600}
    .nav-item.active{color:var(--text-primary);background:var(--bg-elevated)}
    .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
    .light-mode .modal{background:rgba(0,0,0,0.5)}
    .modal.show{display:flex}
    .modal-content{background:var(--bg-card);border:1px solid var(--glass-border);border-radius:var(--radius-xl);padding:24px 20px;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;transform:scale(0.9);transition:transform 0.3s}
    .modal.show .modal-content{transform:scale(1)}
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .modal-title{font-family:var(--font-display);font-size:20px;font-weight:700}
    .modal-close{width:34px;height:34px;border-radius:50%;background:var(--bg-elevated);border:1px solid var(--glass-border);color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.3s}
    .modal-close svg{width:16px;height:16px;stroke:currentColor;stroke-width:2}
    .library-category{margin-bottom:16px}
    .library-category-title{font-size:12px;font-weight:700;color:var(--accent-green);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--glass-border)}
    .library-habit{background:var(--bg-elevated);border:1px solid var(--glass-border);border-radius:var(--radius-md);padding:10px 12px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;transition:all 0.3s}
    .library-habit.in-routine{border-color:var(--accent-green);background:rgba(79,170,90,0.08)}
    .library-habit-name{font-size:12px;font-weight:500;flex:1}
    .library-habit-btn{padding:5px 10px;border-radius:var(--radius-sm);font-size:10px;font-weight:600;border:none;cursor:pointer;transition:all 0.3s}
    .library-habit-btn.add{background:linear-gradient(135deg,var(--earth-forest),var(--accent-green));color:white}
    .library-habit-btn.remove{background:rgba(160,80,80,0.2);color:#c89090}
    .profile-header{text-align:center;padding:24px 18px;background:var(--bg-card);border:1px solid var(--glass-border);border-radius:var(--radius-lg);margin-bottom:16px}
    .profile-name{font-family:var(--font-display);font-size:24px;font-weight:700;margin-bottom:4px}
    .profile-level{font-size:12px;color:var(--accent-green);font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
    .profile-quote{font-size:13px;font-style:italic;color:var(--text-secondary);line-height:1.5;padding:12px;background:var(--bg-elevated);border-radius:var(--radius-md);margin-top:8px}
    .profile-quote-author{font-size:11px;color:var(--accent-green);font-weight:600;margin-top:6px;font-style:normal}
    .onboarding,.daily-checkin{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg-deep);z-index:10000;display:none;flex-direction:column;overflow-y:auto}
    .onboarding.show,.daily-checkin.show{display:flex}
    .onboarding-content{flex:1;padding:32px 20px;max-width:500px;margin:0 auto;width:100%}
    .onboarding-title{font-family:var(--font-display);font-size:26px;font-weight:800;text-align:center;margin-bottom:8px;background:linear-gradient(135deg,var(--earth-sage),var(--accent-green));-webkit-background-clip:text;background-clip:text;color:transparent}
    .onboarding-subtitle{text-align:center;font-size:14px;color:var(--text-secondary);margin-bottom:24px;line-height:1.5}
    .progress{display:flex;gap:4px;margin-bottom:24px;justify-content:center}
    .progress-dot{width:7px;height:7px;border-radius:50%;background:var(--bg-elevated);transition:all 0.3s}
    .progress-dot.active{background:var(--accent-green);width:18px;border-radius:4px}
    .onboarding-nav{display:flex;gap:10px;margin-top:24px}
    .onboarding-nav .btn{flex:1}
    .quick-options{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}
    .quick-option{background:var(--bg-card);border:2px solid var(--glass-border);border-radius:var(--radius-md);padding:18px 12px;cursor:pointer;transition:all 0.3s;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .quick-option.selected{border-color:var(--accent-green);background:rgba(79,170,90,0.1)}
    .quick-option-icon{width:32px;height:32px;margin-bottom:8px;display:flex;align-items:center;justify-content:center}
    .quick-option-icon svg{width:28px;height:28px;stroke:var(--accent-green);stroke-width:1.5;fill:none}
    .quick-option-label{font-size:12px;font-weight:600}
    .survey-options{display:grid;gap:8px;margin-top:14px}
    .survey-option{background:var(--bg-card);border:2px solid var(--glass-border);border-radius:var(--radius-md);padding:14px;cursor:pointer;transition:all 0.3s;text-align:center}
    .survey-option.selected{border-color:var(--accent-green);background:rgba(79,170,90,0.1)}
    .survey-option-title{font-size:14px;font-weight:600;margin-bottom:2px}
    .survey-option-desc{font-size:11px;color:var(--text-secondary)}
    .quote-card{background:linear-gradient(135deg,rgba(61,107,79,0.15),rgba(79,170,90,0.08));border:1px solid var(--earth-forest);border-radius:var(--radius-lg);padding:20px;margin:20px 0;text-align:center}
    .quote-text{font-size:15px;font-style:italic;color:var(--text-primary);line-height:1.5;margin-bottom:10px}
    .quote-author{font-size:12px;color:var(--accent-green);font-weight:600}
    .quotes-list{max-height:300px;overflow-y:auto}
    .quote-item{background:var(--bg-elevated);border:1px solid var(--glass-border);border-radius:var(--radius-md);padding:12px;margin-bottom:8px}
    .quote-item-text{font-size:13px;font-style:italic;color:var(--text-primary);line-height:1.4;margin-bottom:6px}
    .quote-item-author{font-size:11px;color:var(--accent-green);font-weight:600}
    .loading{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg-deep);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:1;transition:opacity 0.6s}
    .loading.hide{opacity:0;pointer-events:none}
    .loading-content{text-align:center;max-width:340px;padding:36px}
    .loading-logo{font-family:var(--font-display);font-size:clamp(28px,7vw,40px);font-weight:800;background:linear-gradient(135deg,var(--earth-sage),var(--accent-green));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px;letter-spacing:2px}
    .loading-subtitle{font-size:13px;color:var(--text-secondary);margin-bottom:36px;line-height:1.5}
    .loading-bar-container{width:100%;height:3px;background:var(--bg-elevated);border-radius:3px;overflow:hidden}
    .loading-bar{width:0%;height:100%;background:linear-gradient(90deg,var(--earth-sage),var(--accent-green));border-radius:3px;animation:loadProgress 1.2s ease-out forwards}
    @keyframes loadProgress{0%{width:0%}100%{width:100%}}
    .tabs{display:flex;gap:4px;margin-bottom:14px;background:var(--bg-card);border:1px solid var(--glass-border);border-radius:var(--radius-md);padding:4px}
    .tab-btn{flex:1;padding:10px;background:transparent;border:none;color:var(--text-muted);font-size:12px;font-weight:600;border-radius:var(--radius-sm);cursor:pointer;transition:all 0.3s}
    .tab-btn.active{background:var(--bg-elevated);color:var(--text-primary)}
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="loading-content">
      <div class="loading-logo">VERTICAL HABITS</div>
      <div class="loading-subtitle">Track stress on the body, not dates on the calendar</div>
      <div class="loading-bar-container"><div class="loading-bar"></div></div>
    </div>
  </div>
  <div class="mountain-bg" id="mountainBg">
    <div class="mountain-layer mountain-1" id="m1"></div>
    <div class="mountain-layer mountain-2" id="m2"></div>
    <div class="mountain-layer mountain-3" id="m3"></div>
  </div>
  <div class="daily-checkin" id="dailyCheckin"></div>
  <div class="onboarding" id="onboarding"></div>
  <div class="app" id="app" style="display:none">
    <div class="header" id="header">
      <div class="logo">VERTICAL HABITS</div>
      <div class="day-info"><span id="dayNum">Day 1</span> · <span id="date"></span></div>
      <div style="text-align:center"><span class="day-badge" id="dayBadge">RECOVERY</span></div>
    </div>
    <div class="content" id="mainContent">
      <div class="page active" id="habitsPage">
        <div class="week-nav"><div class="days-container" id="daysContainer"></div></div>
        <div class="view-toggle">
          <button class="view-btn active" data-view="normal">Normal</button>
          <button class="view-btn" data-view="tiny">Tiny</button>
        </div>
        <div class="habits-list" id="habitsList"></div>

function initMain(){updateHeader();renderWeekNav();renderHabitsForDay();renderSessions();updateStats();updateProfilePage();attachListeners()}
function generateDefaultHabits(){state.activeHabitIds=['water_morning','finger_check','posture_reset','sleep_quality','wrist_circles','shoulder_dislocates','hip_circles','dead_hang','scap_pulls','pushup_set','plank_hold','quiet_feet_focus','straight_arm_reminder','breath_awareness','foam_roll_5min','finger_massage','visualization_1min','process_goal'];save()}
function setDailyQuote(){const today=new Date().toISOString().split('T')[0];if(!state.dailyQuote||state.dailyQuote.date!==today){const available=QUOTES.filter((_,i)=>!state.seenQuotes.includes(i));if(available.length===0)state.seenQuotes=[];const idx=Math.floor(Math.random()*QUOTES.length);state.dailyQuote={quote:QUOTES[idx],date:today,index:idx};if(!state.seenQuotes.includes(idx))state.seenQuotes.push(idx);save()}}
function updateHeader(){const sel=state.selectedDate||new Date().toISOString().split('T')[0];const selDateObj=new Date(sel+'T00:00:00');if(state.startDate)state.day=Math.max(1,Math.floor((selDateObj-new Date(state.startDate+'T00:00:00'))/86400000)+1);document.getElementById('dayNum').textContent='Day '+state.day;document.getElementById('date').textContent=selDateObj.toLocaleDateString('en-US',{month:'short',day:'numeric'});if(!state.dayTypes[sel])state.dayTypes[sel]=['r','t','t','r','p','t','r'][selDateObj.getDay()];state.currentDayType=state.dayTypes[sel];const labels={r:'RECOVERY',t:'TRAINING',p:'PERFORMANCE'};const badge=document.getElementById('dayBadge');badge.textContent=labels[state.currentDayType];badge.className='day-badge badge-'+state.currentDayType;badge.onclick=changeDayType}
function changeDayType(){const types=['r','t','p'];state.currentDayType=types[(types.indexOf(state.currentDayType)+1)%3];state.dayTypes[state.selectedDate||new Date().toISOString().split('T')[0]]=state.currentDayType;save();updateHeader();renderWeekNav();renderHabitsForDay()}
function renderWeekNav(){const container=document.getElementById('daysContainer');const letters=['S','M','T','W','T','F','S'];const todayObj=new Date(),todayStr=todayObj.toISOString().split('T')[0];const sel=state.selectedDate||todayStr;container.innerHTML='';for(let i=0;i<7;i++){const d=new Date(todayObj);d.setDate(d.getDate()-todayObj.getDay()+i);const dateStr=d.toISOString().split('T')[0];if(!state.dayTypes[dateStr])state.dayTypes[dateStr]=['r','t','t','r','p','t','r'][d.getDay()];const dayType=state.dayTypes[dateStr];const div=document.createElement('div');div.className='day-col'+(dateStr===todayStr?' today':'')+(dateStr===sel?' selected':'');div.onclick=()=>selectDay(dateStr);div.innerHTML='<div class="day-letter">'+letters[i]+'</div><div class="day-type '+dayType+'">'+dayType.toUpperCase()+'</div>';container.appendChild(div)}}
function selectDay(dateStr){state.selectedDate=dateStr;save();updateHeader();renderWeekNav();renderHabitsForDay()}
function getHabitsForDay(){const dayType=state.currentDayType;const activeHabits=state.activeHabitIds.map(id=>getHabit(id)).filter(h=>h);const priorityMap={r:['recovery','mobility','mental','daily','technique','strength'],t:['strength','technique','mobility','daily','recovery','mental'],p:['technique','mental','strength','mobility','daily','recovery']};const priorities=priorityMap[dayType]||priorityMap.r;const level=state.userData?.level||'intermediate';const counts={beginner:6,intermediate:8,advanced:10,elite:12};const targetCount=counts[level]||8;const sorted=[...activeHabits].sort((a,b)=>{const aIdx=priorities.indexOf(a.category);const bIdx=priorities.indexOf(b.category);return aIdx-bIdx});return sorted.slice(0,targetCount)}
function renderHabitsForDay(){currentHabitsForDay=getHabitsForDay();const dateStr=state.selectedDate||new Date().toISOString().split('T')[0];renderHabits(currentHabitsForDay,dateStr)}
function renderHabits(habits,today){document.getElementById('habitsList').innerHTML=habits.map(h=>{const text=state.viewMode==='tiny'?h.tiny:h.desc;const checked=isCompleted(h.id,today);return'<div class="habit '+(checked?'completed':'')+'" data-id="'+h.id+'"><div class="habit-top"><div class="checkbox '+(checked?'checked':'')+'" onclick="toggleHabit(\''+h.id+'\',\''+today+'\')"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div><div class="habit-title">'+h.title+'</div><button class="info-btn" onclick="showHabitInfo(\''+h.id+'\')">i</button></div><div class="habit-desc">'+text+'</div></div>'}).join('')}
function isCompleted(id,date){return state.completed[date]?.[id]||false}
function toggleHabit(id,date){if(!state.completed[date])state.completed[date]={};state.completed[date][id]=!state.completed[date][id];save();const el=document.querySelector('.habit[data-id="'+id+'"]');if(el){const cb=el.querySelector('.checkbox');if(state.completed[date][id]){el.classList.add('completed');cb.classList.add('checked')}else{el.classList.remove('completed');cb.classList.remove('checked')}}updateStats()}
function showHabitInfo(id){const h=getHabit(id);if(!h)return;showModal('<div class="modal-header"><div class="modal-title">Edit Habit</div><button class="modal-close" onclick="closeModal()">'+ICONS.x+'</button></div><div class="input-group"><label class="input-label">Title</label><input type="text" class="input" id="editTitle" value="'+h.title+'"></div><div class="input-group"><label class="input-label">Description</label><input type="text" class="input" id="editDesc" value="'+h.desc+'"></div><div class="input-group"><label class="input-label">Tiny Version</label><input type="text" class="input" id="editTiny" value="'+h.tiny+'"></div><div class="input-group"><label class="input-label">What (purpose)</label><textarea class="input" id="editWhat" style="min-height:60px">'+h.what+'</textarea></div><div class="input-group"><label class="input-label">Why (benefit)</label><textarea class="input" id="editWhy" style="min-height:60px">'+h.why+'</textarea></div><div class="input-group"><label class="input-label">How (instruction)</label><textarea class="input" id="editHow" style="min-height:60px">'+h.how+'</textarea></div><button class="btn btn-primary" style="width:100%" onclick="saveHabitEdit(\''+id+'\')">Save Changes</button>')}
function saveHabitEdit(id){state.habitEdits[id]={title:document.getElementById('editTitle').value,desc:document.getElementById('editDesc').value,tiny:document.getElementById('editTiny').value,what:document.getElementById('editWhat').value,why:document.getElementById('editWhy').value,how:document.getElementById('editHow').value};save();renderHabitsForDay();closeModal()}
function addCustomHabit(){showModal('<div class="modal-header"><div class="modal-title">Add Custom Habit</div><button class="modal-close" onclick="closeModal()">'+ICONS.x+'</button></div><div class="input-group"><label class="input-label">Title</label><input type="text" class="input" id="newTitle" placeholder="My Habit"></div><div class="input-group"><label class="input-label">Description</label><input type="text" class="input" id="newDesc" placeholder="What you do"></div><div class="input-group"><label class="input-label">Tiny Version</label><input type="text" class="input" id="newTiny" placeholder="Quick version"></div><div class="input-group"><label class="input-label">Category</label><select class="input" id="newCategory"><option value="daily">Daily</option><option value="mobility">Mobility</option><option value="strength">Strength</option><option value="technique">Technique</option><option value="recovery">Recovery</option><option value="mental">Mental</option></select></div><div class="input-group"><label class="input-label">What (purpose)</label><input type="text" class="input" id="newWhat" placeholder="Purpose of habit"></div><div class="input-group"><label class="input-label">Why (benefit)</label><input type="text" class="input" id="newWhy" placeholder="Why this helps"></div><div class="input-group"><label class="input-label">How (instruction)</label><input type="text" class="input" id="newHow" placeholder="How to do it"></div><button class="btn btn-primary" style="width:100%" onclick="saveCustomHabit()">Add Habit</button>')}
function saveCustomHabit(){const title=document.getElementById('newTitle').value;if(!title){alert('Enter a title');return}const id='custom_'+Date.now();const habit={id,title,desc:document.getElementById('newDesc').value||title,tiny:document.getElementById('newTiny').value||title,category:document.getElementById('newCategory').value,what:document.getElementById('newWhat').value||title,why:document.getElementById('newWhy').value||'Personal goal',how:document.getElementById('newHow').value||'As needed'};state.customHabits.push(habit);state.activeHabitIds.push(id);save();renderHabitsForDay();closeModal()}
function showCurrentHabits(){const active=state.activeHabitIds.map(id=>getHabit(id)).filter(h=>h);const byCategory={};active.forEach(h=>{if(!byCategory[h.category])byCategory[h.category]=[];byCategory[h.category].push(h)});let html='<div class="modal-header"><div class="modal-title">Current Habits</div><button class="modal-close" onclick="closeModal()">'+ICONS.x+'</button></div><div style="max-height:60vh;overflow-y:auto">';Object.keys(byCategory).forEach(cat=>{html+='<div class="library-category"><div class="library-category-title">'+cat+' ('+byCategory[cat].length+')</div>';byCategory[cat].forEach(h=>{html+='<div class="library-habit in-routine"><div class="library-habit-name">'+h.title+'</div><button class="library-habit-btn remove" onclick="removeFromActive(\''+h.id+'\')">Remove</button></div>'});html+='</div>'});html+='</div>';showModal(html)}
function showHabitLibrary(){const allHabits=getAllHabits();const inactive=allHabits.filter(h=>!state.activeHabitIds.includes(h.id));const byCategory={};inactive.forEach(h=>{if(!byCategory[h.category])byCategory[h.category]=[];byCategory[h.category].push(h)});let html='<div class="modal-header"><div class="modal-title">Habit Library</div><button class="modal-close" onclick="closeModal()">'+ICONS.x+'</button></div><div style="font-size:12px;color:var(--text-secondary);margin-bottom:12px">'+inactive.length+' habits available to add</div><div style="max-height:55vh;overflow-y:auto">';Object.keys(byCategory).forEach(cat=>{html+='<div class="library-category"><div class="library-category-title">'+cat+' ('+byCategory[cat].length+')</div>';byCategory[cat].forEach(h=>{html+='<div class="library-habit"><div class="library-habit-name">'+h.title+'</div><button class="library-habit-btn add" onclick="addToActive(\''+h.id+'\')">Add</button></div>'});html+='</div>'});if(inactive.length===0)html+='<div style="text-align:center;padding:20px;color:var(--text-muted)">All habits added!</div>';html+='</div>';showModal(html)}
function addToActive(id){if(!state.activeHabitIds.includes(id)){state.activeHabitIds.push(id);save();showHabitLibrary();renderHabitsForDay()}}
function removeFromActive(id){const idx=state.activeHabitIds.indexOf(id);if(idx>-1){state.activeHabitIds.splice(idx,1);save();showCurrentHabits();renderHabitsForDay()}}
function showAllQuotes(){let html='<div class="modal-header"><div class="modal-title">All Quotes</div><button class="modal-close" onclick="closeModal()">'+ICONS.x+'</button></div><div class="quotes-list">';QUOTES.forEach(q=>{html+='<div class="quote-item"><div class="quote-item-text">"'+q.text+'"</div><div class="quote-item-author">— '+q.author+'</div></div>'});html+='</div>';showModal(html)}
function renderSessions(){const list=document.getElementById('sessionsList');if(!state.sessions.length){list.innerHTML='<div style="text-align:center;padding:32px;color:var(--text-muted)">No sessions yet</div>';return}list.innerHTML=state.sessions.slice(0,10).map(s=>'<div class="session"><div class="session-header"><span class="session-date">'+new Date(s.date).toLocaleDateString()+'</span><span class="session-grade">'+s.grade+'</span></div><div class="session-details">'+s.discipline+' · '+s.duration+' min'+(s.notes?'<br>'+s.notes:'')+'</div></div>').join('')}
function saveSessionFn(){const discipline=document.getElementById('discipline').value,grade=document.getElementById('grade').value,duration=document.getElementById('duration').value,notes=document.getElementById('notes').value;if(!grade||!duration){alert('Enter grade and duration');return}state.sessions.unshift({date:new Date().toISOString(),discipline,grade,duration:parseInt(duration),notes});['grade','duration','notes'].forEach(id=>document.getElementById(id).value='');save();renderSessions();updateStats()}
function updateStats(){let current=0,best=0,temp=0;for(let i=0;i<state.day;i++){const d=new Date(state.startDate);d.setDate(d.getDate()+i);const ds=d.toISOString().split('T')[0];if(state.completed[ds]&&Object.values(state.completed[ds]).some(v=>v)){temp++;best=Math.max(best,temp);if(i===state.day-1)current=temp}else temp=0}document.getElementById('currentStreak').textContent=current;document.getElementById('bestStreak').textContent=best;document.getElementById('totalDays').textContent=state.day;document.getElementById('totalSessions').textContent=state.sessions.length}
function updateProfilePage(){document.getElementById('profileName').textContent=state.userData?.name||'Climber';document.getElementById('profileLevel').textContent=(state.userData?.level||'intermediate').charAt(0).toUpperCase()+(state.userData?.level||'intermediate').slice(1);const q=state.dailyQuote?.quote||QUOTES[0];document.getElementById('profileQuote').innerHTML='"'+q.text+'"<div class="profile-quote-author">— '+q.author+'</div>';document.getElementById('profileNameInput').value=state.userData?.name||'';document.getElementById('profileLevelSelect').value=state.userData?.level||'intermediate';document.getElementById('profileGoal').value=state.userData?.goal||'strength'}
function updateProfile(key,value){state.userData[key]=value;save();updateProfilePage();renderHabitsForDay()}
function updateTimerDisplay(){document.getElementById('timerTime').textContent=String(Math.floor(state.timerSec/60)).padStart(2,'0')+':'+String(state.timerSec%60).padStart(2,'0')}
function startTimer(){if(state.timerRunning){clearInterval(state.timerInterval);state.timerRunning=false;document.getElementById('timerStart').textContent='Start';return}const duration=parseInt(document.getElementById('timerDuration').value)||30;const delay=parseInt(document.getElementById('timerDelay').value)||0;state.timerSec=duration;state.timerRunning=true;document.getElementById('timerStart').textContent='Pause';if(delay>0){let remaining=delay;const delayInt=setInterval(()=>{document.getElementById('timerTime').textContent=remaining+'...';remaining--;if(remaining<0){clearInterval(delayInt);runTimer()}},1000)}else runTimer()}
function runTimer(){updateTimerDisplay();state.timerInterval=setInterval(()=>{if(state.timerSec>0){state.timerSec--;updateTimerDisplay()}else{clearInterval(state.timerInterval);state.timerRunning=false;document.getElementById('timerStart').textContent='Start';tripleBeep()}},1000)}
function resetTimer(){clearInterval(state.timerInterval);state.timerRunning=false;state.timerSec=parseInt(document.getElementById('timerDuration').value)||30;document.getElementById('timerStart').textContent='Start';updateTimerDisplay()}
function startInterval(){const work=parseInt(document.getElementById('workSec').value)||40,rest=parseInt(document.getElementById('restSec').value)||20,sets=parseInt(document.getElementById('sets').value)||8,rounds=parseInt(document.getElementById('rounds').value)||1;let currentSet=1,currentRound=1,isWork=true;state.timerSec=work;clearInterval(state.timerInterval);updateTimerDisplay();state.timerInterval=setInterval(()=>{if(state.timerSec>0){state.timerSec--;updateTimerDisplay()}else{if(isWork){beep(800,0.1);state.timerSec=rest;isWork=false}else{currentSet++;if(currentSet>sets){currentSet=1;currentRound++;if(currentRound>rounds){clearInterval(state.timerInterval);tripleBeep();return}}state.timerSec=work;isWork=true}updateTimerDisplay()}},1000)}
function updateMountain(){const h=Math.min(state.day/365,1)*50;document.getElementById('m1').style.height=h+'%';document.getElementById('m2').style.height=(h*0.8)+'%';document.getElementById('m3').style.height=(h*0.6)+'%';document.getElementById('mountainBg').style.opacity=state.showMountain?0.4:0}
function switchPage(page){document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));document.querySelector('[data-page="'+page+'"]').classList.add('active');document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(page+'Page').classList.add('active');document.getElementById('header').style.display=page==='habits'?'block':'none';if(page==='profile')updateProfilePage()}
function showModal(content){const m=document.getElementById('modal');m.innerHTML='<div class="modal-content">'+content+'</div>';m.classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='vertical-habits.json';a.click()}
function resetData(){if(confirm('Delete ALL data?')&&confirm('Are you sure?')){localStorage.removeItem('verticalHabitsData');location.reload()}}
function save(){localStorage.setItem('verticalHabitsData',JSON.stringify(state))}
let dailyStep=0;
function showDailyCheckin(){dailyStep=0;state.todayContext={};document.getElementById('dailyCheckin').classList.add('show');renderDailyCheckin()}
function renderDailyCheckin(){const dc=document.getElementById('dailyCheckin');const name=state.userData?.name||'Climber';const isFirstTime=!state.onboarding;let html='<div class="onboarding-content">';if(dailyStep===0){html+='<div class="onboarding-title">'+(isFirstTime?'Welcome to Vertical Habits':'Welcome back, '+name)+'</div><div class="onboarding-subtitle">How recovered do you feel?</div>';html+='<div class="quick-options"><div class="quick-option '+(state.todayContext.recovery==='great'?'selected':'')+'" onclick="setDailyContext(\'recovery\',\'great\')"><div class="quick-option-icon">'+ICONS.muscle+'</div><div class="quick-option-label">Great</div></div><div class="quick-option '+(state.todayContext.recovery==='good'?'selected':'')+'" onclick="setDailyContext(\'recovery\',\'good\')"><div class="quick-option-icon">'+ICONS.thumbsUp+'</div><div class="quick-option-label">Good</div></div><div class="quick-option '+(state.todayContext.recovery==='tired'?'selected':'')+'" onclick="setDailyContext(\'recovery\',\'tired\')"><div class="quick-option-icon">'+ICONS.moon+'</div><div class="quick-option-label">Tired</div></div><div class="quick-option '+(state.todayContext.recovery==='sore'?'selected':'')+'" onclick="setDailyContext(\'recovery\',\'sore\')"><div class="quick-option-icon">'+ICONS.alert+'</div><div class="quick-option-label">Sore</div></div></div>';html+='<div class="onboarding-nav"><button class="btn btn-skip" onclick="skipDailyCheckin()">Skip</button><button class="btn btn-primary" onclick="nextDailyStep()">Next</button></div>'}else if(dailyStep===1){html+='<div class="onboarding-title">Today\'s Plan</div><div class="onboarding-subtitle">What are you doing today?</div>';html+='<div class="quick-options"><div class="quick-option '+(state.todayContext.activity==='climbing'?'selected':'')+'" onclick="setDailyContext(\'activity\',\'climbing\')"><div class="quick-option-icon">'+ICONS.mountain+'</div><div class="quick-option-label">Climbing</div></div><div class="quick-option '+(state.todayContext.activity==='training'?'selected':'')+'" onclick="setDailyContext(\'activity\',\'training\')"><div class="quick-option-icon">'+ICONS.dumbbell+'</div><div class="quick-option-label">Training</div></div><div class="quick-option '+(state.todayContext.activity==='rest'?'selected':'')+'" onclick="setDailyContext(\'activity\',\'rest\')"><div class="quick-option-icon">'+ICONS.sofa+'</div><div class="quick-option-label">Rest Day</div></div><div class="quick-option '+(state.todayContext.activity==='active'?'selected':'')+'" onclick="setDailyContext(\'activity\',\'active\')"><div class="quick-option-icon">'+ICONS.walking+'</div><div class="quick-option-label">Active Recovery</div></div></div>';html+='<div class="onboarding-nav"><button class="btn btn-secondary" onclick="prevDailyStep()">Back</button><button class="btn btn-primary" onclick="nextDailyStep()">'+(isFirstTime?'Next':'Done')+'</button></div>'}else if(dailyStep===2&&isFirstTime){const q=SURVEY[obStep]||SURVEY[0];html+='<div class="onboarding-title">Quick Setup</div><div class="onboarding-subtitle">'+q.q+'</div>';if(q.type==='text')html+='<div style="margin:24px 0"><input type="text" class="input" id="surveyInput" placeholder="'+q.placeholder+'" value="'+(state.userData[q.key]||'')+'" style="text-align:center"></div>';else html+='<div class="survey-options">'+q.options.map(opt=>'<div class="survey-option '+(state.userData[q.key]===opt.val?'selected':'')+'" onclick="selectOption(\''+q.key+'\',\''+opt.val+'\')"><div class="survey-option-title">'+opt.label+'</div></div>').join('')+'</div>';html+='<div class="onboarding-nav"><button class="btn btn-secondary" onclick="prevDailyStep()">Back</button><button class="btn btn-primary" onclick="nextSurveyStep()">Next</button></div>'}else{showQuoteAndFinish();return}html+='</div>';dc.innerHTML=html}
let obStep=0;
function selectOption(key,val){state.userData[key]=val;renderDailyCheckin()}
function nextSurveyStep(){const q=SURVEY[obStep];if(q.type==='text'&&document.getElementById('surveyInput'))state.userData[q.key]=document.getElementById('surveyInput').value;obStep++;if(obStep>=SURVEY.length){state.onboarding=true;generateDefaultHabits();showQuoteAndFinish()}else{renderDailyCheckin()}}
function setDailyContext(key,val){state.todayContext[key]=val;renderDailyCheckin()}
function nextDailyStep(){dailyStep++;if(!state.onboarding&&dailyStep===2){obStep=0;renderDailyCheckin()}else if(state.onboarding&&dailyStep===2){showQuoteAndFinish()}else{renderDailyCheckin()}}
function prevDailyStep(){if(dailyStep===2&&obStep>0){obStep--;renderDailyCheckin()}else{dailyStep--;if(dailyStep<0)dailyStep=0;renderDailyCheckin()}}
function skipDailyCheckin(){if(!state.onboarding){state.onboarding=true;generateDefaultHabits()}showQuoteAndFinish()}
function showQuoteAndFinish(){const today=new Date().toISOString().split('T')[0];state.lastCheckinDate=today;if(state.todayContext.activity==='rest'||state.todayContext.activity==='active'||state.todayContext.recovery==='sore'){state.dayTypes[today]='r';state.currentDayType='r'}else if(state.todayContext.activity==='climbing'){state.dayTypes[today]='p';state.currentDayType='p'}else if(state.todayContext.activity==='training'){state.dayTypes[today]='t';state.currentDayType='t'}save();setDailyQuote();const q=state.dailyQuote?.quote||QUOTES[0];const dc=document.getElementById('dailyCheckin');dc.innerHTML='<div class="onboarding-content" style="display:flex;flex-direction:column;justify-content:center;min-height:100vh"><div class="quote-card"><div class="quote-text">"'+q.text+'"</div><div class="quote-author">— '+q.author+'</div></div><button class="btn btn-primary" style="width:100%" onclick="finishCheckin()">Let\'s Go</button></div>'}
function finishCheckin(){document.getElementById('dailyCheckin').classList.remove('show');showApp()}
function attachListeners(){document.querySelectorAll('.nav-item').forEach(item=>item.addEventListener('click',()=>switchPage(item.dataset.page)));document.getElementById('addHabit')?.addEventListener('click',addCustomHabit);document.getElementById('saveSession')?.addEventListener('click',saveSessionFn);document.getElementById('timerStart')?.addEventListener('click',startTimer);document.getElementById('timerReset')?.addEventListener('click',resetTimer);document.getElementById('startInterval')?.addEventListener('click',startInterval);document.getElementById('soundToggle')?.addEventListener('click',function(){this.classList.toggle('on');state.soundEnabled=this.classList.contains('on');save()});document.getElementById('mountainToggle')?.addEventListener('click',function(){this.classList.toggle('on');state.showMountain=this.classList.contains('on');updateMountain();save()});document.getElementById('lightToggle')?.addEventListener('click',function(){this.classList.toggle('on');state.lightMode=this.classList.contains('on');document.body.classList.toggle('light-mode',state.lightMode);save()});document.getElementById('exportBtn')?.addEventListener('click',exportData);document.getElementById('resetBtn')?.addEventListener('click',resetData);document.getElementById('currentHabitsBtn')?.addEventListener('click',showCurrentHabits);document.getElementById('habitLibraryBtn')?.addEventListener('click',showHabitLibrary);document.getElementById('quotesBtn')?.addEventListener('click',showAllQuotes);document.querySelectorAll('.view-btn').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');state.viewMode=btn.dataset.view;save();renderHabits(currentHabitsForDay,state.selectedDate||new Date().toISOString().split('T')[0])}))}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
